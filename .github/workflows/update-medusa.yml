# .github/workflows/update-medusa.yml
name: Update Medusa

on: 
  workflow_dispatch: # Allow manual runs
  repository_dispatch:
    types: [medusa-release-published]

jobs:
  update:
    # Required for opening PRs
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update Medusa
        uses: medusajs/medusa-update-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-version: ${{ github.event.client_payload.version }}
          
